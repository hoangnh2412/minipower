name: minipower-hooks

# Chạy golden test cho hook logic (SSOT dùng chung Cursor/Claude/OpenCode).
# Matrix 3 OS: chính là lưới bắt lại class bug cross-platform mà bản .ps1/.sh/.ts
# từng lệch nhau (regex có dấu/không dấu, path / vs \). Xem ADRs/.

on:
  push:
    paths:
      - "package.json"
      - "cli/**"
      - "src/**"
      - "contracts/**"
      - ".github/workflows/minipower-hooks.yml"
      - "**/*.md"
  pull_request:
    paths:
      - "package.json"
      - "cli/**"
      - "src/**"
      - "contracts/**"
      - ".github/workflows/minipower-hooks.yml"
      - "**/*.md"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/router/hooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests (node --test)
        run: node --test

  link-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/router/hooks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check markdown links (npm run link:check)
        run: npm run link:check

  version-check:
    # WARN, không chặn pipeline (ADR-044 Q2) — nâng FAIL sau khi kiểm chứng qua 2 lần bump thật.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/router/hooks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check skill metadata.version bump (npm run version:check)
        run: npm run version:check -- --base ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
